<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <!-- Fundo Cósmico -->
  <rect width="192" height="192" rx="42" fill="#070b14" />
  <circle cx="96" cy="96" r="88" fill="url(#bgGlow)" />
  <circle cx="96" cy="96" r="82" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 6" />

  <!-- Estrelas de Fundo -->
  <circle cx="48" cy="52" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="144" cy="45" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="152" cy="138" r="1.5" fill="#facc15" opacity="0.8" />
  <circle cx="38" cy="130" r="2" fill="#e879f9" opacity="0.6" />

  <!-- Chama de Propulsão de Plasma -->
  <path d="M96 142 Q90 128 92 116 Q96 122 100 116 Q102 128 96 142 Z" fill="url(#flameGrad)" />

  <!-- Foguete Espacial Explorador -->
  <g transform="translate(96, 88) rotate(-45)">
    <!-- Corpo Principal -->
    <path d="M0 -36 C14 -22 16 10 12 24 L-12 24 C-16 10 -14 -22 0 -36 Z" fill="url(#rocketGrad)" />
    <!-- Aletas Laterais -->
    <path d="M-12 12 L-24 26 L-10 24 Z" fill="#4338ca" />
    <path d="M12 12 L24 26 L10 24 Z" fill="#4338ca" />
    <!-- Escotilha Holográfica -->
    <circle cx="0" cy="-6" r="6.5" fill="#070b14" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="-6" r="3.5" fill="#38bdf8" opacity="0.85" />
    <!-- Cone de Nariz -->
    <path d="M0 -36 C6 -30 7 -22 7 -18 L-7 -18 C-7 -22 -6 -30 0 -36 Z" fill="#facc15" />
  </g>
</svg>
