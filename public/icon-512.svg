<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="rocketGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="flameGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <!-- Fundo Cósmico -->
  <rect width="512" height="512" rx="110" fill="#070b14" />
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow512)" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 12" />

  <!-- Estrelas de Fundo -->
  <circle cx="120" cy="130" r="3.5" fill="#ffffff" opacity="0.9" />
  <circle cx="390" cy="115" r="4.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="410" cy="380" r="3.5" fill="#facc15" opacity="0.8" />
  <circle cx="95" cy="350" r="4" fill="#e879f9" opacity="0.7" />

  <!-- Chama de Propulsão de Plasma -->
  <path d="M256 380 Q240 340 245 310 Q256 325 267 310 Q272 340 256 380 Z" fill="url(#flameGrad512)" />

  <!-- Foguete Espacial Explorador -->
  <g transform="translate(256, 235) rotate(-45)">
    <!-- Corpo Principal -->
    <path d="M0 -96 C36 -60 42 26 32 64 L-32 64 C-42 26 -36 -60 0 -96 Z" fill="url(#rocketGrad512)" />
    <!-- Aletas Laterais -->
    <path d="M-32 32 L-64 70 L-26 64 Z" fill="#4338ca" />
    <path d="M32 32 L64 70 L26 64 Z" fill="#4338ca" />
    <!-- Escotilha Holográfica -->
    <circle cx="0" cy="-16" r="17" fill="#070b14" stroke="#38bdf8" stroke-width="5" />
    <circle cx="0" cy="-16" r="9" fill="#38bdf8" opacity="0.85" />
    <!-- Cone de Nariz Dourado -->
    <path d="M0 -96 C16 -80 18 -60 18 -48 L-18 -48 C-18 -60 -16 -80 0 -96 Z" fill="#facc15" />
  </g>
</svg>
